/* Layout: one column (max 640px). Hero = the player count on a pitch-green panel, then skede and mode, then a growing stack of exercise cards; once there are results the settings collapse into a green summary bar. Bib orange is the only action colour; phase colours mark anfall / försvar / omställning. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface-2:#E3E9E1; --ink:#13201A; --muted:#56665B; --line:#CCD6CB;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE3D6;

  --bib-a:#EA580C; --bib-b:#1D4ED8; --cone:#F2B705; --ball:#FFFFFF;
  --att:#C2410C; --att-soft:#FBE3D6; --def:#2E5FA0; --def-soft:#DDE7F5; --tra:#1F6143; --tra-soft:#DCEFE2;
  --bad:#B42318; --bad-soft:#FBE0DD; --warn:#9A6200; --warn-soft:#FBEFD2;
  --shadow:0 1px 2px rgba(19,32,26,.08),0 6px 20px rgba(19,32,26,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16201A; --surface-2:#1E2A23; --ink:#E3EBE5; --muted:#93A499; --line:#2B3A31;
  --accent:#FB7A3C; --accent-ink:#1B0D05; --accent-soft:#3A2116;
  --pitch:#174A33; --pitch-2:#1A5139; --pitch-line:rgba(255,255,255,.55);
  --bib-a:#FB7A3C; --bib-b:#6E9BFF; --cone:#F2C230; --ball:#F4F4F4;
  --att:#FB7A3C; --att-soft:#3A2116; --def:#7FA8E8; --def-soft:#1B2A40; --tra:#5DBA84; --tra-soft:#18301F;
  --bad:#F2766C; --bad-soft:#3A1A18; --warn:#E5B647; --warn-soft:#352A12;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16201A; --surface-2:#1E2A23; --ink:#E3EBE5; --muted:#93A499; --line:#2B3A31;

  --pitch:#174A33; --pitch-2:#1A5139; --pitch-line:rgba(255,255,255,.55);
  --bib-a:#FB7A3C; --bib-b:#6E9BFF; --cone:#F2C230; --ball:#F4F4F4;
  --att:#FB7A3C; --att-soft:#3A2116; --def:#7FA8E8; --def-soft:#1B2A40; --tra:#5DBA84; --tra-soft:#18301F;

  --shadow:0 1px 2px rgba(0,0,0,.4);

}
*{box-sizing:border-box}

button,input,select,textarea{font:inherit;color:inherit}

@media (max-width:420px){.phase-row{grid-template-columns:repeat(2,1fr)}}
details.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .08s ease}
