<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Övningsfabriken</title>
<meta name="theme-color" content="#102820">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/ovningsfabriken-32.png">
<link rel="apple-touch-icon" href="./icon-192.png?v=2">
<script>
/* Klubb och lag kommer nu från kontot, så den gamla lagvalssidan behövs inte.
   Allt skickas vidare till appen, som visar inloggning, klubbens startbild och lagval. */
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ['klubb', 'inbjudan', 'utvecklare'].forEach(function (k) { if (q.get(k)) out.set(k, q.get(k)); });
  location.replace('app.html' + (out.toString() ? '?' + out.toString() : '') + location.hash);
})();
</script>
<style>body{margin:0;background:#102820}</style>
</head>
<body><noscript><a href="app.html">Öppna Övningsfabriken</a></noscript></body>
</html>
