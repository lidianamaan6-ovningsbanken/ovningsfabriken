<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122820">
  <title>Välj lag · Övningsfabriken</title>
  <link rel="icon" href="assets/ovningsfabriken-32.png">
  <link rel="apple-touch-icon" href="icon-192.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="lagval.css">
  <script src="lagkatalog.js" defer></script>
  <script src="lagval.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <header class="login-cover">
      <p class="login-brand"><img src="assets/ovningsfabriken-logo-light.svg" width="280" height="92" alt="Övningsfabriken"></p>
      <div><h1>Välkommen till Övningsfabriken</h1><p>Välj din klubb och ditt lag för att börja planera.</p></div>
    </header>
    <section class="login-card" aria-labelledby="login-step">
      <button class="login-back" type="button" hidden>Tillbaka till klubbar</button>
      <h2 id="login-step" tabindex="-1">Välj din klubb</h2>
      <div id="login-clubs">
        <label for="club-search">Sök klubb</label>
        <input type="search" id="club-search" placeholder="Exempelvis Järfälla eller Sollentuna" autocomplete="off">
        <ul class="login-clubs" aria-label="Klubbar"></ul>
        <p id="login-empty" role="status" hidden>Ingen klubb matchar din sökning.</p>
      </div>
      <form id="login-form" method="get" action="app.html" hidden>
        <label for="login-team">Lag</label>
        <select id="login-team" name="team" required></select>
        <p class="login-help">Dina ändringar sparas i den här webbläsaren.</p>
        <button class="login-submit" type="submit">Öppna appen</button>
      </form>
      
      <p class="entry-skip"><a href="app.html?utan-lag=1">Fortsätt utan lag</a></p>
      <noscript><p>Aktivera JavaScript för att kunna välja ditt lag.</p></noscript>
    </section>
  </main>
</body>
</html>
